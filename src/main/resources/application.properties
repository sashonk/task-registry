spring.application.name=task

# H2 file-based database
spring.datasource.url=jdbc:h2:file:./data/taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Worker settings
worker.poll-delay-ms=1000

# Scheduler settings
scheduler.enabled=true
scheduler.poll-interval-ms=5000

# Task execution settings
task.script.timeout-seconds=10
task.file-check.base-path=./data
