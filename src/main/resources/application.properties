spring.application.name=task

# H2 file-based database
spring.datasource.url=jdbc:h2:file:./data/taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# H2 console (http://localhost:8080/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Worker settings
worker.poll-delay-ms=1000

# Scheduler settings
scheduler.enabled=true
scheduler.poll-interval-ms=5000

# Task execution settings
task.script.timeout-seconds=10
task.file-check.base-path=./data

# Kafka (opt-in)
app.kafka.enabled=true
app.kafka.task-create-topic=task.create

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=task-registry
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=ru.asocial.task.dto
spring.kafka.consumer.properties.spring.json.value.default.type=ru.asocial.task.dto.TaskCreateRequest
spring.kafka.listener.auto-startup=${app.kafka.enabled:false}
