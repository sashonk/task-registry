spring.application.name=audit

server.port=8084

spring.datasource.url=jdbc:h2:file:./data/auditdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.driver-class-name=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=ru.asocial.audit.config.H2DialectWithoutEnumChecks
spring.jpa.show-sql=false

# Kafka
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=audit-service

app.jwt.secret=${APP_JWT_SECRET:change-me-to-a-secret-key-at-least-32-chars-long!!}
app.jwt.issuer=jobflow-auth
app.jwt.access-token-ttl=PT8H
