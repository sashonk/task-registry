spring.application.name=scheduler-service

server.port=8082

spring.datasource.url=jdbc:h2:file:./data/schedulerdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=ru.asocial.scheduler.config.H2DialectWithoutEnumChecks
spring.jpa.show-sql=true

scheduler.enabled=true
scheduler.poll-interval-ms=5000

app.kafka.task-create-topic=task.create

spring.kafka.bootstrap-servers=localhost:9092

app.jwt.secret=${APP_JWT_SECRET:change-me-to-a-secret-key-at-least-32-chars-long!!}
app.jwt.issuer=jobflow-auth
app.jwt.access-token-ttl=PT8H
