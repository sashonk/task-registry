spring.datasource.url=jdbc:h2:mem:schedtest;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE

app.kafka.enabled=false
app.kafka.task-create-topic=task.create
spring.autoconfigure.exclude=org.springframework.boot.kafka.autoconfigure.KafkaAutoConfiguration

app.jwt.secret=test-secret-key-at-least-32-characters-long
app.jwt.issuer=jobflow-auth
app.jwt.access-token-ttl=PT1H
