services:
  kafka:
    image: docker.redpanda.com/redpandadata/redpanda:v24.2.4
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:9092
      - --smp 1
      - --memory 512M
      - --overprovisioned
      - --mode dev-container
    ports:
      - "9092:19092"
    healthcheck:
      test: ["CMD", "rpk", "cluster", "health"]
      interval: 5s
      timeout: 5s
      retries: 12
      start_period: 15s
            
  akhq:
    image: tchiotludo/akhq
    ports:
      - "8088:8080"
    environment:
      AKHQ_CONFIGURATION: |
        akhq:
          connections:
            docker-kafka:
              properties:
                bootstrap.servers: "kafka:9092"
    depends_on:
      kafka:
        condition: service_healthy
  auth:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: auth/auth-impl
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-secret-key-at-least-32-chars-long!!}
    volumes:
      - auth-data:/app/data

  tasks:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: tasks/tasks-impl
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-secret-key-at-least-32-chars-long!!}
    volumes:
      - tasks-data:/app/data
    depends_on:
      kafka:
        condition: service_healthy

  scheduler:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: scheduler/scheduler-impl
    environment:
      SPRING_PROFILES_ACTIVE: docker
      APP_JWT_SECRET: ${APP_JWT_SECRET:-change-me-to-a-secret-key-at-least-32-chars-long!!}
    volumes:
      - scheduler-data:/app/data
    depends_on:
      kafka:
        condition: service_healthy

  gateway:
    build:
      context: .
      dockerfile: Dockerfile
      args:
        MODULE: gateway/gateway-impl
    ports:
      - "8080:8080"
    environment:
      SPRING_PROFILES_ACTIVE: docker
    depends_on:
      - auth
      - tasks
      - scheduler

volumes:
  auth-data:
  tasks-data:
  scheduler-data:
