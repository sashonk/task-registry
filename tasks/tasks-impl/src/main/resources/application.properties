spring.application.name=tasks

server.port=8081

# H2 file-based database (clean start — delete ./data/ before first run)
spring.datasource.url=jdbc:h2:file:./data/taskdb;DB_CLOSE_DELAY=-1;DB_CLOSE_ON_EXIT=FALSE
spring.datasource.username=sa
spring.datasource.password=

# JPA / Hibernate
spring.jpa.hibernate.ddl-auto=update
spring.jpa.database-platform=ru.asocial.task.config.H2DialectWithoutEnumChecks
spring.jpa.show-sql=true

# H2 console (http://localhost:8081/h2-console)
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console

# Worker settings
worker.poll-delay-ms=1000
worker.enabled=true

# Task execution settings
task.script.timeout-seconds=10
task.file-check.base-path=./data

# Kafka
app.kafka.enabled=true
app.kafka.task-create-topic=task.create

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=task-registry
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.ErrorHandlingDeserializer
spring.kafka.consumer.properties.spring.deserializer.key.delegate.class=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.properties.spring.deserializer.value.delegate.class=org.springframework.kafka.support.serializer.JacksonJsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=ru.asocial.task.dto
spring.kafka.consumer.properties.spring.json.value.default.type=ru.asocial.task.dto.TaskCreateCommand
spring.kafka.listener.auto-startup=${app.kafka.enabled:false}

app.jwt.secret=${APP_JWT_SECRET:change-me-to-a-secret-key-at-least-32-chars-long!!}
app.jwt.issuer=jobflow-auth
app.jwt.access-token-ttl=PT8H
